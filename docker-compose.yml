services:
  postgres:
    image: postgres:16
    container_name: pipescan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipescan
      POSTGRES_PASSWORD: pipescan
      POSTGRES_DB: pipescan
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pipescan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipescan -d pipescan"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pipescan_postgres_data:
